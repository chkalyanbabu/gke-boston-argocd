apiVersion: apps/v1
kind: Deployment
metadata:
  name: boston
  namespace: boston
  labels:
    app: boston
spec:
  replicas: 2
  selector:
    matchLabels:
      app: boston
  template:
    metadata:
      labels:
        app: boston
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          readinessProbe:          # GKE Ingress derives its LB health check from this
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: html
          configMap:
            name: boston-html
